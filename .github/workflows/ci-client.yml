name: ci-client

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/ci-client.yml']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm install || npm install
      - name: Type check
        run: npx tsc --noEmit