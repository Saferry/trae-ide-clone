name: ci-server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/ci-server.yml']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Smoke import
        run: |
          python -c "from trae_server.main import create_app; app = create_app(); print('ok')"
      - name: Run tests
        env:
          TRAE_CONFIG: tests/fixtures/trae.test.yaml
        run: pytest -q